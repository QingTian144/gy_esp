plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gy.esp'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.gy.esp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // 和平精英只有 arm64 版本
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                // 静态链接 libc++，产物不依赖额外 so
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // 去掉调试符号，减小体积并去掉路径特征
            ndk {
                debugSymbolLevel 'none'
            }
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    // 无第三方依赖
}
