name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK 与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: 定位工程根目录
        id: root
        run: |
          if [ -f "gy_esp/settings.gradle" ]; then
            echo "dir=gy_esp" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: 生成 Gradle Wrapper
        working-directory: ${{ steps.root.outputs.dir }}
        run: gradle wrapper --gradle-version 8.5

      - name: 编译 Release APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: sysmon-apk
          path: ${{ steps.root.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
